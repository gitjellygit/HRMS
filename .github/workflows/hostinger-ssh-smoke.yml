name: Hostinger SSH connection test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-connection:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure deployment SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/hrms_deploy
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hrms_deploy ~/.ssh/known_hosts
      - name: Test verified GitHub runner to VPS connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -i ~/.ssh/hrms_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'set -eu
              printf "REMOTE_ACCOUNT: "; whoami
              cd /opt/jellygit/hrms
              printf "DEPLOYED_SHA: "; git rev-parse HEAD
              docker compose config --quiet
              docker compose ps
              curl -fsS --max-time 8 http://127.0.0.1:8000/health'
