name: HRMS checks
on:
  push:
    branches: [feature/hrms-mvp, feature/employee-core-1-10, main]
  pull_request:
    branches: [main, feature/hrms-mvp]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m compileall -q backend/app
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Import backend and validate OpenAPI
        env:
          JWT_SECRET: test-only-long-secret-1234567890-abcdefgh
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.main import app
          paths=app.openapi()['paths']
          assert '/core/employees' in paths
          assert '/core/employees-import' in paths
          assert '/core/org-chart' in paths
          print('Validated',len(paths),'API routes')
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
